<style>
  /* Layout: her arched cover with a terracotta seal opens onto a stack of shuffling cards on warm parchment, with petals drifting down. */
  :root {
    --ground: #f7ecda;
    --ground-deep: #ebd6b6;
    --door: #e3c9a3;
    --gold: #a4552e;
    --gold-soft: #6e3b23;
    --text: #5b3220;
    --on-accent: #fff8ee;
    --script: "Pinyon Script", "Snell Roundhand", cursive;
    --display: "Cormorant Garamond", "Cormorant", Georgia, serif;
    --body: "Jost", "Futura", "Century Gothic", system-ui, sans-serif;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  html { overflow: hidden; overscroll-behavior: none; }   /* one-screen page: the tilted back card must not let the page wobble sideways */
  body {
    margin: 0;
    background: radial-gradient(120% 90% at 50% 0%, var(--ground) 0%, var(--ground-deep) 100%) var(--ground-deep);
    color: var(--text);
    font-family: var(--body);
    padding-block: 12px;
    padding-left: max(clamp(8px, 2.5vw, 16px), env(safe-area-inset-left, 0px));
    padding-right: max(clamp(8px, 2.5vw, 16px), env(safe-area-inset-right, 0px));
    overflow: hidden;
  }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--gold-soft); outline-offset: 3px; }

  /* ---------- Ambient layers ---------- */
  .sky { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
  .spark {
    position: absolute; background: var(--gold);
    clip-path: polygon(50% 0, 62% 38%, 100% 50%, 62% 62%, 50% 100%, 38% 62%, 0 50%, 38% 38%);
    opacity: .2; animation: twinkle var(--d, 3s) ease-in-out var(--delay, 0s) infinite;
  }
  @keyframes twinkle { 0%,100% { opacity: .12; transform: scale(.6) rotate(0deg); } 50% { opacity: .95; transform: scale(1.1) rotate(25deg); } }
  #petals { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 5; pointer-events: none; }

  /* ---------- Cards ---------- */
  .stage {
    position: relative; z-index: 1;
    height: 100%; display: flex; flex-direction: column; gap: 10px;
    max-width: 980px; margin: 0 auto;
  }
  .stage[inert] { visibility: hidden; }
  .tabs {
    display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none;
    padding: 2px 0 6px; justify-content: safe center;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    flex: 0 0 auto; cursor: pointer;
    background: transparent; border: 1px solid rgba(164,85,46,.32); border-radius: 999px;
    padding: 7px 14px; line-height: 1.15; text-align: center;
    font-family: var(--body); font-size: 12px; letter-spacing: .12em; text-transform: uppercase;
    color: var(--gold-soft);
    opacity: 0; transform: translateY(-8px);
    transition: background .25s, color .25s, border-color .25s;
  }
  .tab small { display: block; font-size: 10px; letter-spacing: .08em; opacity: .75; margin-top: 2px; text-transform: none; }
  .tab[aria-current="true"] { background: var(--gold); border-color: var(--gold); color: var(--ground-deep); }
  .tab[aria-current="true"] small { opacity: .8; }
  .stage.revealed .tab { animation: dropin .7s cubic-bezier(.2,.8,.2,1) both; animation-delay: calc(.3s + var(--i, 0) * 80ms); }
  @keyframes dropin { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: none; } }

  .viewport { position: relative; flex: 1 1 0; min-height: 0; }
  .modes, .tabs, .foot, .shufflehint { flex-shrink: 0; }
  .track {
    height: 100%; display: flex; overflow-x: auto; overflow-y: hidden;
    scroll-snap-type: x mandatory; scrollbar-width: none; scroll-behavior: smooth;
    overscroll-behavior-x: contain;
  }
  .track::-webkit-scrollbar { display: none; }
  .slide { flex: 0 0 100%; height: 100%; min-width: 0; scroll-snap-align: center; scroll-snap-stop: always; padding: 4px 2px; }
  .slide img {
    display: block; width: 100%; height: 100%; object-fit: contain;
    filter: drop-shadow(0 14px 26px rgba(92,50,24,.26));
    opacity: 0; transform: translateY(26px) scale(.94);
    transition: opacity .7s ease, transform .9s cubic-bezier(.2,.8,.2,1);
  }
  .stage.revealed .slide img { opacity: .45; transform: scale(.93); transition-delay: .25s; }
  .stage.revealed .slide.is-active img { opacity: 1; transform: none; transition-delay: .25s; }
  .stage.settled .slide img, .stage.settled .slide.is-active img { transition-delay: 0s; }

  .arrow {
    display: none; position: absolute; top: 50%; translate: 0 -50%;
    width: 44px; height: 44px; border-radius: 50%; cursor: pointer;
    background: rgba(247,236,218,.88); border: 1px solid rgba(164,85,46,.45); color: var(--gold-soft);
    font-size: 20px; line-height: 1;
  }
  .arrow:hover { background: var(--gold); color: var(--ground-deep); }
  .arrow.prev { left: 0; } .arrow.next { right: 0; }
  @media (min-width: 760px) { .arrow { display: block; } }

  .foot { display: flex; flex-direction: column; align-items: center; gap: 6px; min-height: 64px; justify-content: center; }
  .foot[hidden] { display: none; }
  .where { font-size: 13px; color: var(--text); opacity: .85; text-align: center; margin: 0; text-wrap: balance; }
  .go {
    display: inline-flex; align-items: center; gap: 8px; text-decoration: none; cursor: pointer;
    background: var(--gold); color: var(--ground-deep);
    font-family: var(--body); font-weight: 500; font-size: 13px; letter-spacing: .14em; text-transform: uppercase;
    padding: 11px 20px; border-radius: 999px; transition: background .2s;
  }
  .go:hover { background: var(--gold-soft); }

  /* ---------- Envelope intro ---------- */
  .intro {
    position: fixed; inset: 0; z-index: 20;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; text-align: center;
    padding-block: 12px;
    padding-left: max(clamp(8px, 2.5vw, 16px), env(safe-area-inset-left, 0px));
    padding-right: max(clamp(8px, 2.5vw, 16px), env(safe-area-inset-right, 0px));
    transition: opacity .7s ease, transform .9s ease;
  }
  .intro[hidden] { display: none; }
  .intro.leaving { opacity: 0; transform: scale(1.12) translateY(-2%); pointer-events: none; }
  .eyebrow { font-family: var(--body); font-size: 12px; letter-spacing: .32em; text-transform: uppercase; color: var(--gold); margin: 0; }
  .envelope {
    all: unset; cursor: pointer; position: relative; display: block;
    width: min(100%, 560px); border-radius: 6px;
    box-shadow: 0 22px 50px rgba(92,50,24,.28);
    transition: transform .35s ease;
  }
  .envelope:hover { transform: translateY(-3px); }
  .envelope:focus-visible { outline: 2px solid var(--gold-soft); outline-offset: 6px; }
  .envelope img { display: block; width: 100%; height: auto; border-radius: 6px; }
  .envelope .ring {
    position: absolute; left: 49.9%; top: 70.6%; width: 14%; aspect-ratio: 1; border-radius: 50%;
    translate: -50% -50%; border: 1.5px solid var(--gold); pointer-events: none;
    animation: ring 2.4s ease-out infinite;
  }
  @keyframes ring { from { transform: scale(1); opacity: .9; } to { transform: scale(1.9); opacity: 0; } }
  .hint { font-family: var(--display); font-style: italic; font-size: 22px; color: var(--gold-soft); margin: 0; animation: breathe 2.6s ease-in-out infinite; }
  @keyframes breathe { 0%,100% { opacity: .5 } 50% { opacity: 1 } }

  /* ---------- Viewing styles: scroll, swipe, shuffle ---------- */
  .modes { display: flex; justify-content: center; }
  .seg { display: inline-flex; border: 1px solid rgba(164,85,46,.32); border-radius: 999px; padding: 2px; gap: 2px; }
  .seg button {
    all: unset; cursor: pointer; padding: 5px 14px; border-radius: 999px;
    font-family: var(--body); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--gold-soft);
    transition: background .25s, color .25s;
  }
  .seg button[aria-pressed="true"] { background: var(--gold); color: var(--ground-deep); }
  .seg button:focus-visible { outline: 2px solid var(--gold-soft); outline-offset: 2px; }
  .sdir, .shufflehint { display: none; }

  .stage.scroll .track { display: block; overflow-x: hidden; overflow-y: auto; scroll-snap-type: none; }
  .stage.scroll .slide { height: auto; padding: 18px 2px 34px; scroll-snap-align: none; scroll-snap-stop: normal; }
  .stage.scroll .slide:last-child { padding-bottom: 80px; }
  .stage.scroll .slide img { height: auto; max-width: 460px; margin-inline: auto; }
  .stage.scroll.revealed .slide img { opacity: 0; transform: translateY(46px) scale(.95); transition-delay: 0s; }
  .stage.scroll.revealed .slide.seen img { opacity: 1; transform: none; transition-delay: .25s; }
  .stage.scroll.settled .slide.seen img { transition-delay: 0s; }
  .stage.scroll .sdir { display: flex; flex-direction: column; align-items: center; gap: 8px; margin-top: 18px; }
  .stage.scroll .foot, .stage.scroll .arrow { display: none; }

  .stage.shuffle .track { position: relative; display: block; overflow: visible; scroll-snap-type: none; touch-action: none; user-select: none; -webkit-user-select: none; cursor: pointer; }
  .stage.shuffle .slide {
    position: absolute; inset: 0; padding: clamp(6px, 2.5vw, 26px) clamp(4px, 2.5vw, 28px); scroll-snap-align: none;
    --tx: 0px; --ty: 0px; --r: 0deg; --s: 1;
    transform: translate(var(--tx), var(--ty)) rotate(var(--r)) scale(var(--s));
    transform-origin: 50% 85%;
    z-index: calc(12 - var(--d, 0));
    transition: transform 1.1s cubic-bezier(.25,.8,.25,1), filter 1.1s ease, opacity .6s ease;
  }
  .stage.shuffle .slide[data-d="1"] { --tx: 18px; --ty: -12px; --r: 3.5deg; --s: .97; filter: brightness(.92); }
  .stage.shuffle .slide[data-d="2"] { --tx: -18px; --ty: -18px; --r: -3.5deg; --s: .94; filter: brightness(.84); }
  .stage.shuffle .slide[data-d="3"] { --ty: -22px; --s: .9; filter: brightness(.6); opacity: 0; transition-delay: 0s, 0s, .3s; }
  .stage.shuffle.revealed .slide img, .stage.shuffle.revealed .slide.is-active img { opacity: 1; transform: none; transition-delay: 0s; }
  .stage.shuffle .slide.fly { animation: fly 1.2s cubic-bezier(.45,0,.25,1); }
  .stage.shuffle .slide.flyin { animation: flyin 1.2s cubic-bezier(.2,.8,.2,1); }
  @keyframes fly { 0% { transform: translateX(var(--dx, 0px)) rotate(var(--dr, 0deg)); z-index: 14; } 45% { transform: translateX(calc(112% * var(--fx, 1))) rotate(calc(11deg * var(--fx, 1))); z-index: 14; } 46% { z-index: 0; } 100% { z-index: 0; } }
  @keyframes flyin { 0% { transform: translateX(-112%) rotate(-11deg); z-index: 14; } 100% { z-index: 14; } }
  .stage.shuffle .slide.zoomed-in { overflow: hidden; }
  .track.ptr:focus-visible { outline: none; }
  .stage.shuffle.cardzoom .track { cursor: grab; }
  .stage.shuffle .shufflehint { display: block; text-align: center; font-size: 12px; letter-spacing: .1em; color: var(--gold-soft); opacity: .8; margin: 0; }

  .modes { position: relative; min-height: 36px; }
  .back {
    all: unset; cursor: pointer; position: absolute; left: 0; top: 50%; translate: 0 -50%;
    width: 34px; height: 34px; border-radius: 50%; border: 1px solid rgba(164,85,46,.32);
    display: grid; place-items: center; color: var(--gold-soft); transition: background .25s, color .25s;
  }
  .back:hover { background: var(--gold); color: var(--ground-deep); }
  .back:focus-visible { outline: 2px solid var(--gold-soft); outline-offset: 2px; }
  .back svg { width: 18px; height: 18px; }

  .sound {
    all: unset; cursor: pointer; position: absolute; right: 0; top: 50%; translate: 0 -50%;
    width: 34px; height: 34px; border-radius: 50%; border: 1px solid rgba(164,85,46,.32);
    display: grid; place-items: center; color: var(--gold-soft); transition: background .25s, color .25s;
  }
  .sound:hover { background: var(--gold); color: var(--ground-deep); }
  .sound:focus-visible { outline: 2px solid var(--gold-soft); outline-offset: 2px; }
  .sound svg { width: 18px; height: 18px; }
  .sound .off { display: none; }
  .sound[aria-pressed="false"] .on { display: none; }
  .sound[aria-pressed="false"] .off { display: block; }

  /* ---------- Prachi's side ---------- */
  html { overflow: hidden; overscroll-behavior: none; }   /* one-screen page: the tilted back card must not let the page wobble sideways */
  .spark { background: #c38d3f; }
  .tab[aria-current="true"], .go, .arrow:hover, .back:hover, .sound:hover { color: var(--on-accent); }
  .go:hover { background: var(--gold-soft); }
  .envelope { width: min(100%, 440px, calc((100vh - 190px) * .667)); width: min(100%, 440px, calc((100dvh - 190px) * .667)); }
  /* title page: the brass bells on the garlands sway gently from where they hang */
  .envelope { overflow: hidden; }
  .envelope .bell { position: absolute; display: block; max-width: none; pointer-events: none;
    transform-origin: var(--ox) var(--oy); animation: sway var(--dur) ease-in-out var(--delay) infinite alternate; will-change: transform; }
  @keyframes sway { from { transform: rotate(var(--a0)); } to { transform: rotate(var(--a1)); } }
  .pseal {
    position: absolute; left: 50%; top: 73%; width: 21%; aspect-ratio: 1; translate: -50% -50%;
    border-radius: 50%; display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle at 34% 28%, #e3a46a 0%, #b8642f 55%, #8c4520 100%);
    box-shadow: 0 6px 16px rgba(92,50,24,.45), inset 0 0 0 2px rgba(255,236,210,.45), inset 0 0 0 6px rgba(140,69,32,.35);
    font-family: var(--display); font-weight: 600; color: #fff3e2; letter-spacing: .06em;
    font-size: clamp(15px, 4.6vw, 22px); pointer-events: none;
  }
  .pseal i { display: inline-block; width: 1px; height: 1.1em; background: rgba(255,243,226,.75); margin: 0 .3em; }
  .envelope .ring { top: 73%; width: 21%; border-color: #b8642f; }
  @media (prefers-reduced-motion: reduce) {
    .envelope .bell { animation: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    .intro, .envelope, .slide img, .tab { transition: none; }
    .spark, .envelope .ring, .hint { animation: none; }
    .stage.revealed .tab { animation: none; opacity: 1; transform: none; }
    .stage.revealed .slide img { opacity: .45; transform: scale(.93); }
    .stage.revealed .slide.is-active img { opacity: 1; transform: none; }
    .track { scroll-behavior: auto; }
    .stage.shuffle .slide.fly, .stage.shuffle .slide.flyin { animation: none; }
  }
</style>
</head>
<body>

<script>
(function () {
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var intro = document.getElementById('intro');
  var stage = document.getElementById('stage');
  var track = document.getElementById('track');
  var tabsEl = document.getElementById('tabs');
  var foot = document.getElementById('foot');
  var whereEl = document.getElementById('where');
  var go = document.getElementById('go');
  var slides = Array.prototype.slice.call(track.children);
  var tabs = [];
  var current = 0;
  var mode = 'shuffle';

  /* sparkles */
  var sky = document.getElementById('sky');
  for (var n = 0; n < 22; n++) {
    var sp = document.createElement('span');
    sp.className = 'spark';
    var sz = 6 + Math.random() * 12;
    sp.style.cssText = 'left:' + (Math.random() * 100) + '%;top:' + (Math.random() * 100) + '%;width:' + sz + 'px;height:' + sz +
      'px;--d:' + (2.4 + Math.random() * 3.2) + 's;--delay:-' + (Math.random() * 5) + 's';
    sky.appendChild(sp);
  }

  /* tabs */
  slides.forEach(function (s, i) {
    var b = document.createElement('button');
    b.type = 'button';

    b.appendChild(document.createTextNode(s.dataset.tab));
    var sm = document.createElement('small');
    sm.textContent = s.dataset.sub;
    b.appendChild(sm);
    b.addEventListener('click', function () { goTo(i); });
    tabsEl.appendChild(b);
    tabs.push(b);
  });

  function mapLink(s) {
    if (s.dataset.ll) return 'https://www.google.com/maps/search/?api=1&query=' + s.dataset.ll + '&query_place_id=' + s.dataset.pid;
    return 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(s.dataset.q);
  }
  function setActive(i, dir, prev) {

    current = i;
    tabs.forEach(function (t, k) {

    });
    slides.forEach(function (s, k) { s.classList.toggle('is-active', k === i); });

    slides.forEach(function (s, k) { var d = (k - i + n) % n; s.style.setProperty('--d', d); s.dataset.d = Math.min(d, 3); });

      var el = dir > 0 ? slides[prev] : slides[i];
      if (el && (dir < 0 || prev !== i)) { el.classList.remove('fly', 'flyin'); void el.offsetWidth; el.classList.add(dir > 0 ? 'fly' : 'flyin'); }
    }
    var s = slides[i];
    if (s.dataset.q) {
      foot.hidden = false;
      whereEl.textContent = s.dataset.where;
      go.href = mapLink(s);
    } else {
      foot.hidden = true;
    }
    var t = tabs[i];
    tabsEl.scrollTo({ left: t.offsetLeft - (tabsEl.clientWidth - t.offsetWidth) / 2, behavior: 'smooth' });
  }
  function goTo(i) {
    i = Math.max(0, Math.min(slides.length - 1, i));
    if (mode === 'scroll') { track.scrollTo({ top: slides[i].offsetTop }); setActive(i); }

  }

  function step(dir) {

    if (e.key === 'ArrowLeft') { e.preventDefault(); step(-1); }
  });
  document.getElementById('prev').addEventListener('click', function () { step(-1); });
  document.getElementById('next').addEventListener('click', function () { step(1); });
  window.addEventListener('resize', function () {
    if (mode !== 'swipe') return;
    track.style.scrollBehavior = 'auto';
    track.scrollLeft = current * track.clientWidth;
    track.style.scrollBehavior = '';
  });

  /* directions under each card (scroll view) */
  slides.forEach(function (s) {
    s.addEventListener('animationend', function () { s.classList.remove('fly', 'flyin'); s.style.removeProperty('--dx'); s.style.removeProperty('--dr'); s.style.removeProperty('--fx'); });
    if (!s.dataset.q) return;
    var d = document.createElement('div'); d.className = 'sdir';
    var p = document.createElement('p'); p.className = 'where'; p.textContent = s.dataset.where;
    var a = document.createElement('a'); a.className = 'go'; a.target = '_blank'; a.rel = 'noopener'; a.textContent = 'View location';
    a.href = mapLink(s);
    d.appendChild(p); d.appendChild(a); s.appendChild(d);
  });

  /* viewing style */
  var modeBtns = {};
  function setMode(m) {
    mode = m;
    stage.classList.toggle('scroll', m === 'scroll');
    stage.classList.toggle('shuffle', m === 'shuffle');
    Object.keys(modeBtns).forEach(function (k) { modeBtns[k].setAttribute('aria-pressed', k === m ? 'true' : 'false'); });
    track.style.scrollBehavior = 'auto';
    track.scrollTop = m === 'scroll' ? slides[current].offsetTop : 0;
    track.scrollLeft = m === 'swipe' ? current * track.clientWidth : 0;
    track.style.scrollBehavior = '';
    setActive(current);
  }
  Object.keys(modeBtns).forEach(function (k) { modeBtns[k].addEventListener('click', function () { setMode(k); }); });

  /* card stack gestures, all handled here so every phone behaves the same:
     one finger: tap = next card, swipe = next/previous (the card follows the finger);
     two fingers: pinch to zoom the card; while zoomed, one finger moves around and a tap zooms back out */
  var pts = {}, nPts = 0, gesture = null, sx = 0, sy = 0, st = 0;
  var z = 1, tx = 0, ty = 0, z0 = 1, t0x = 0, t0y = 0, d0 = 1, m0x = 0, m0y = 0, cx = 0, cy = 0;
  var MAXZ = 4, hintEl = document.querySelector('.shufflehint'), hintText = hintEl ? hintEl.textContent : '';
  function cardImg() { return slides[current].querySelector('img'); }
  function drawn(im) {   /* size of the card as drawn inside its box (object-fit: contain) */
    var bw = im.offsetWidth, bh = im.offsetHeight, ar = (im.naturalWidth || 2) / (im.naturalHeight || 3);
    var dw = Math.min(bw, bh * ar); return { bw: bw, bh: bh, dw: dw, dh: dw / ar };
  }
  function clampPan() {
    var d = drawn(cardImg());
    var mx = Math.max(0, (d.dw * z - d.bw) / 2), my = Math.max(0, (d.dh * z - d.bh) / 2);
    tx = Math.max(-mx, Math.min(mx, tx)); ty = Math.max(-my, Math.min(my, ty));
  }
  function applyZoom(animate) {
    var im = cardImg();
    im.style.transition = animate ? 'transform .25s ease' : 'none';
    im.style.transform = z > 1 ? 'translate(' + tx + 'px,' + ty + 'px) scale(' + z + ')' : '';
    slides[current].classList.toggle('zoomed-in', z > 1);
    stage.classList.toggle('cardzoom', z > 1);
    if (hintEl) hintEl.textContent = z > 1 ? 'Drag to move around \u00b7 tap to zoom out' : hintText;
  }
  function resetZoom(animate) { if (z === 1 && !tx && !ty) return; z = 1; tx = 0; ty = 0; applyZoom(animate); }
  function centre() {   /* untransformed centre of the card on screen */
    var r = cardImg().getBoundingClientRect(); cx = r.left + r.width / 2 - tx; cy = r.top + r.height / 2 - ty;
  }
  function settle(s) {
    if (!s) return;
    s.style.transition = 'transform .28s cubic-bezier(.2,.8,.2,1)';
    s.style.transform = '';
    setTimeout(function () { s.style.transition = ''; }, 300);
  }
  function two() { var k = Object.keys(pts); return [pts[k[0]], pts[k[1]]]; }
  function startPinch() {
    var p = two(); d0 = Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y) || 1;
    m0x = (p[0].x + p[1].x) / 2; m0y = (p[0].y + p[1].y) / 2; z0 = z; t0x = tx; t0y = ty; centre();
  }
  function startOne(x, y) { sx = x; sy = y; st = Date.now(); t0x = tx; t0y = ty; }
  track.addEventListener('dragstart', function (e) { e.preventDefault(); });
  track.addEventListener('gesturestart', function (e) { e.preventDefault(); });   /* older iPhones: no page zoom on the card */
  track.addEventListener('pointerdown', function (e) {
    track.classList.add('ptr');
    if (mode !== 'shuffle') return;
    if (e.isPrimary || !nPts) { pts = {}; nPts = 0; gesture = null; }   /* every new touch starts clean */
    if (!pts[e.pointerId]) nPts++;
    pts[e.pointerId] = { x: e.clientX, y: e.clientY };
    if (e.pointerType === 'mouse') { try { track.setPointerCapture(e.pointerId); } catch (err) {} }
    if (nPts === 1) startOne(e.clientX, e.clientY);
    else if (nPts === 2) { if (gesture === 'swipe') settle(slides[current]); gesture = 'pinch'; startPinch(); }
  });
  track.addEventListener('pointermove', function (e) {
    if (!pts[e.pointerId]) return;
    pts[e.pointerId] = { x: e.clientX, y: e.clientY };
    if (gesture === 'pinch' && nPts >= 2) {
      var p = two(), d = Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y), mx = (p[0].x + p[1].x) / 2, my = (p[0].y + p[1].y) / 2;
      z = Math.max(1, Math.min(MAXZ, z0 * d / d0));
      tx = mx - cx - z * (m0x - cx - t0x) / z0; ty = my - cy - z * (m0y - cy - t0y) / z0;
      clampPan(); applyZoom(false); return;
    }
    if (nPts !== 1) return;
    var dx = e.clientX - sx, dy = e.clientY - sy;
    if (z > 1 || gesture === 'pan') {
      if (gesture === null && Math.abs(dx) + Math.abs(dy) > 6) gesture = 'pan';
      if (gesture === 'pan') { tx = t0x + dx; ty = t0y + dy; clampPan(); applyZoom(false); }
      return;
    }
    if (shuffleBusy) return;
    if (gesture === null && Math.abs(dx) > 10 && Math.abs(dx) > Math.abs(dy)) gesture = 'swipe';
    if (gesture === 'swipe' && !reduce) {
      var s = slides[current];
      s.style.transition = 'none';
      s.style.transform = 'translateX(' + dx + 'px) rotate(' + (dx * 0.03) + 'deg)';
    }
  });
  function lift(e, cancelled) {
    if (!pts[e.pointerId]) return;
    delete pts[e.pointerId]; nPts--;
    if (gesture === 'pinch') {
      if (nPts === 1) { var k = Object.keys(pts)[0]; startOne(pts[k].x, pts[k].y); gesture = 'pan'; }   /* one finger left: keep moving */
      if (z < 1.08) resetZoom(true);
      return;
    }
    if (nPts > 0) return;
    var g = gesture; gesture = null;
    var dx = e.clientX - sx, dy = e.clientY - sy, quick = Date.now() - st < 300, s = slides[current];
    if (g === 'pan') { if (z < 1.08) resetZoom(true); return; }
    if (cancelled) { if (g === 'swipe') settle(s); return; }
    if (z > 1) { if (Math.abs(dx) < 12 && Math.abs(dy) < 12) resetZoom(true); return; }   /* tap while zoomed: zoom out */

  track.addEventListener('pointerup', function (e) { lift(e, false); });
  track.addEventListener('pointercancel', function (e) { lift(e, true); });

  if ('IntersectionObserver' in window) {
    var seenIO = new IntersectionObserver(function (es) {
      es.forEach(function (e) { if (e.isIntersecting) e.target.classList.add('seen'); });
    }, { root: track, threshold: 0.15 });
    var midIO = new IntersectionObserver(function (es) {
      es.forEach(function (e) {
        if (e.isIntersecting && mode === 'scroll') { var i = slides.indexOf(e.target); if (i !== current) setActive(i); }
      });
    }, { root: track, rootMargin: '-45% 0px -45% 0px' });
    slides.forEach(function (s) { seenIO.observe(s); midIO.observe(s); });
  } else {
    slides.forEach(function (s) { s.classList.add('seen'); });
  }

  /* petals */
  var canvas = document.getElementById('petals');
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0, petals = [], running = false;
  var colors = ['#e9a23b', '#d9822b', '#cfa95f', '#c4525d', '#f0c987'];
  function size() {
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = canvas.clientWidth; H = canvas.clientHeight;
    canvas.width = W * dpr; canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  function make(spread) {
    return {
      x: Math.random() * W, y: spread ? Math.random() * H : -20 - Math.random() * 60,
      s: 5 + Math.random() * 7, vy: .45 + Math.random() * .8, sw: Math.random() * 6.28, ss: .012 + Math.random() * .02,
      amp: .35 + Math.random() * .9, r: Math.random() * 6.28, vr: (Math.random() - .5) * .05,
      c: colors[(Math.random() * colors.length) | 0], a: .5 + Math.random() * .45

  }
  var rafId = 0, lastTick = 0;
  function frame(now) {
    if (!running) return;
    now = now || performance.now();
    var k = lastTick ? Math.min(Math.max((now - lastTick) / 16.67, 0), 3) : 1;  // same speed at 30, 60 or 120 fps
    lastTick = now;
    rafId = requestAnimationFrame(frame);   // book the next frame first so one bad frame can't stop the loop
    if (!W || !H) size();
    ctx.clearRect(0, 0, W, H);
    for (var i = 0; i < petals.length; i++) {
      var p = petals[i];
      p.y += p.vy * k; p.sw += p.ss * k; p.x += Math.sin(p.sw) * p.amp * k; p.r += p.vr * k;
      if (p.y > H + 20) petals[i] = p = make(false);
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.r);
      ctx.scale(1, .55 + .45 * Math.abs(Math.sin(p.sw)));
      ctx.globalAlpha = p.a;
      ctx.fillStyle = p.c;
      ctx.beginPath();
      ctx.ellipse(0, 0, p.s, p.s * .5, 0, 0, 6.2832);
      ctx.fill();
      ctx.restore();
    }
  }
  /* restart the loop if the phone froze it (switching apps, coming back from Maps, locking the screen) */
  function kickPetals() {
    if (!running || document.hidden) return;
    if (performance.now() - lastTick > 600) {
      cancelAnimationFrame(rafId);
      lastTick = 0;
      size();
      rafId = requestAnimationFrame(frame);
    }
  }
  document.addEventListener('visibilitychange', kickPetals);
  window.addEventListener('pageshow', kickPetals);
  window.addEventListener('focus', kickPetals);
  setInterval(kickPetals, 1500);
  function startPetals() {
    if (reduce || running) return;
    size();
    var count = W < 600 ? 22 : 34;
    petals = [];
    for (var i = 0; i < count; i++) { var p = make(false); p.y = -Math.random() * H; petals.push(p); }
    running = true;
    lastTick = 0;
    cancelAnimationFrame(rafId);
    rafId = requestAnimationFrame(frame);
  }
  window.addEventListener('resize', function () { if (running) size(); });

  /* music: starts with the tap on the seal (phones need a tap before sound) */
  var music = document.getElementById('music');
  var soundBtn = document.getElementById('sound');
  var muted = false, fadeTimer = 0;
  try { muted = localStorage.getItem('ps-invite-muted') === '1'; } catch (e) {}

    soundBtn.setAttribute('aria-pressed', muted ? 'false' : 'true');
    soundBtn.setAttribute('aria-label', muted ? 'Play music' : 'Mute music');

  }
  function playMusic() {
    if (muted) return;
    clearInterval(fadeTimer);
    try { music.volume = 0; } catch (e) {}
    var pr;
    try { pr = music.play(); } catch (e) {}
    if (pr && pr.catch) pr.catch(function () {});
    fadeTimer = setInterval(function () {
      try { music.volume = Math.min(0.6, music.volume + 0.04); } catch (e) {}
      if (music.volume >= 0.6) clearInterval(fadeTimer);
    }, 100);
  }
  soundBtn.addEventListener('click', function () {
    muted = !muted;
    try { localStorage.setItem('ps-invite-muted', muted ? '1' : '0'); } catch (e) {}
    if (muted) music.pause(); else playMusic();
    showSound();
  });
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) music.pause();
    else if (!muted && intro.hidden) playMusic();
  });
  window.addEventListener('pageshow', function (e) {
    if (e.persisted && !muted && intro.hidden) playMusic();
  });
  showSound();

  /* open */
  function reveal() {
    stage.removeAttribute('inert');
    stage.classList.add('revealed');
    setActive(0);
    intro.hidden = true;
    setTimeout(function () { stage.classList.add('settled'); track.focus({ preventScroll: true }); }, 1600);
  }
  function open() {
    playMusic();
    if (reduce) { reveal(); stage.classList.add('settled'); return; }
    intro.classList.add('leaving');
    startPetals();
    setTimeout(reveal, 700);
  }
  document.getElementById('open').addEventListener('click', open);
  document.getElementById('back').addEventListener('click', function () {
    running = false;
    music.pause();
    try { music.currentTime = 0; } catch (e) {}
    ctx.clearRect(0, 0, W, H);
    stage.setAttribute('inert', '');
    stage.classList.remove('revealed', 'settled');
    track.style.scrollBehavior = 'auto';
    track.scrollTop = 0; track.scrollLeft = 0;
    track.style.scrollBehavior = '';
    setActive(0);
    intro.hidden = false;
    void intro.offsetWidth;
    intro.classList.remove('leaving');
    document.getElementById('open').focus({ preventScroll: true });
  });
  /* a link ending in #shuffle, #swipe or #scroll opens in that style */
  function fromHash() {
    var h = (location.hash || '').replace('#', '');
    if ((h === 'shuffle' || h === 'swipe' || h === 'scroll') && h !== mode) setMode(h);
  }
  setActive(0);
})();
</script>
